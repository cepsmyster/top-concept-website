<!doctype html>
<!--
  Turns a render into blueprint linework (transparent WebP) for the home hero.
  Run from the site folder (Chrome must be allowed to read local files):
    chrome --headless=new --allow-file-access-from-files --dump-dom "file:///…/site/src/blueprint.html?src=../assets/img/hero.webp&w=1600" > out.txt
  The page prints a data: URL; node src/build.mjs does not run this, see README "Home hero".
-->
<meta charset="utf-8">
<pre id="out"></pre>
<script>
const q = new URLSearchParams(location.search);
const img = new Image();
img.onload = () => {
  const W = Math.min(+q.get("w") || 1600, img.naturalWidth);
  const H = Math.round(W * img.naturalHeight / img.naturalWidth);
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, W, H);
  const d = ctx.getImageData(0, 0, W, H).data;

  // luminance, then a light 3×3 blur so glass reflections don't turn into noise
  const L = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) L[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
  const B = new Float32Array(W * H);
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    let s = 0;
    for (let j = -1; j <= 1; j++) for (let k = -1; k <= 1; k++) s += L[(y + j) * W + x + k] * (j || k ? (j && k ? 1 : 2) : 4);
    B[y * W + x] = s / 16;
  }

  // Sobel edges → soft-thresholded line alpha
  const lo = +q.get("lo") || 48, hi = +q.get("hi") || 160;
  const out = ctx.createImageData(W, H), o = out.data;
  for (let y = 3; y < H - 3; y++) for (let x = 3; x < W - 3; x++) { // skip the edge rows the blur left empty
    const i = y * W + x;
    const gx = B[i - W + 1] + 2 * B[i + 1] + B[i + W + 1] - B[i - W - 1] - 2 * B[i - 1] - B[i + W - 1];
    const gy = B[i + W - 1] + 2 * B[i + W] + B[i + W + 1] - B[i - W - 1] - 2 * B[i - W] - B[i - W + 1];
    const a = Math.min(1, Math.max(0, (Math.hypot(gx, gy) - lo) / (hi - lo)));
    o[i * 4] = 220; o[i * 4 + 1] = 234; o[i * 4 + 2] = 255; o[i * 4 + 3] = Math.round(Math.pow(a, 1.3) * 235);
  }
  ctx.clearRect(0, 0, W, H);
  ctx.putImageData(out, 0, 0);
  document.getElementById("out").textContent = c.toDataURL("image/webp", +q.get("q") || 0.82);
};
img.src = q.get("src");
</script>
